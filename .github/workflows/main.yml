name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  composer:
    name: "Composer configuration validation"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - run: "make validate"

  php:
    name: "PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
        dependencies: ["default"]
        include:
          - php-version: "8.1"
            dependencies: "lowest"
    steps:
      - uses: "actions/checkout@v4"
      - name: "Install dependencies"
        run: "make install PHP_VERSION=${{ matrix.php-version }} DEPENDENCIES_LOWEST=${{ matrix.dependencies == 'lowest' && 1 || 0 }}"
      - name: "Check PHP syntax"
        run: "make lint PHP_VERSION=${{ matrix.php-version }}"
      - name: "Run behavior tests"
        run: "make test PHP_VERSION=${{ matrix.php-version }}"
      - name: "Run PHPStan"
        run: "make analyze PHP_VERSION=${{ matrix.php-version }}"
      - name: "Audit dependencies"
        if: "matrix.php-version == '8.1'"
        run: "make audit PHP_VERSION=${{ matrix.php-version }} DEPENDENCIES_LOWEST=${{ matrix.dependencies == 'lowest' && 1 || 0 }}"
